[package]
name = "reportes_view"
version = "0.1.0"
authors = ["[your_name] <[your_email]>"]
edition = "2021"

[dependencies]
# misma versión que el principal
ink = { version = "5.1.1", default-features = false }
# dependencia al contrato principal para poder usar MarketplacePrincipalRef
marketplace_principal = { path = "../marketplace_principal", default-features = false, features = ["ink-as-dependency"] }

[dev-dependencies]
ink_e2e = { version = "5.0.0" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "marketplace_principal/std",
]
ink-as-dependency = []
e2e-tests = []

[package]
name = "reportes_view"
version = "0.1.0"
authors = ["[your_name] <[your_email]>"]
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
parity-scale-codec = { version = "3.6.9", features = ["derive"], default-features = false }
scale-info = { version = "2.10.0", features = ["derive"], default-features = false }
marketplace_principal = { path = "../marketplace_principal", default-features = false, features = ["ink-as-dependency"] }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "marketplace_principal/std",
]
ink-as-dependency = []
e2e-tests = []